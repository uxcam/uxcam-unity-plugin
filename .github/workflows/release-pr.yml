name: Release PR

# Opens a pull request that sets the version and adds release notes built from commit messages. Merging it releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.1
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency: release-pr

jobs:
  release-pr:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: release/v${{ inputs.version }}
      CHANGELOG: com.uxcam.unity/CHANGELOG.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, to list the commits since the previous release

      - name: Check the version
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Run this workflow on main." >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Version must look like 1.2.3, got '$VERSION'." >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

      - name: Build the release notes
        run: |
          handwritten="$(awk '
            $0 == "## [Unreleased]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$CHANGELOG" | sed '/./,$!d')"

          generated=""
          if previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null)"; then
            generated="$(git log --no-merges --format=%s "$previous..HEAD" | awk '
              # "fix(android): crash on start" -> "- **android:** Crash on start"
              function entry(s,    scope) {
                scope = ""
                if (match(s, /^[A-Za-z]+\(/)) { scope = substr(s, RLENGTH + 1); sub(/\).*/, "", scope) }
                sub(/^[A-Za-z]+(\([^)]*\))?!?: */, "", s)
                return "- " (scope == "" ? "" : "**" scope ":** ") toupper(substr(s, 1, 1)) substr(s, 2) "\n"
              }
              function section(title, items) {
                if (items == "") return
                if (printed) print ""
                printf "### %s\n%s", title, items
                printed = 1
              }
              /^[A-Za-z]+(\([^)]*\))?!: /                                { breaking = breaking entry($0); next }
              /^feat(\([^)]*\))?: /                                      { added = added entry($0); next }
              /^fix(\([^)]*\))?: /                                       { fixed = fixed entry($0); next }
              /^perf(\([^)]*\))?: /                                      { changed = changed entry($0); next }
              /^(chore|docs|refactor|test|ci|build|style)(\([^)]*\))?: / { next }
              { other = other "- " $0 "\n" }
              END {
                section("Breaking changes", breaking)
                section("Added", added)
                section("Changed", changed)
                section("Fixed", fixed)
                section("Other", other)
              }
            ')"
          fi

          {
            if [ -n "$handwritten" ]; then printf '%s\n' "$handwritten"; fi
            if [ -n "$handwritten" ] && [ -n "$generated" ]; then echo; fi
            if [ -n "$generated" ]; then printf '%s\n' "$generated"; fi
          } > "$RUNNER_TEMP/release-notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "Nothing to release: no user-facing commits since ${previous:-the first commit}." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Write the version and the CHANGELOG
        run: |
          sed -i -E "s/^(  \"version\": \")[^\"]*\"/\1$VERSION\"/" com.uxcam.unity/package.json
          sed -i -E "s/(PluginVersion = \")[^\"]*\"/\1$VERSION\"/" com.uxcam.unity/Runtime/UXCam.cs
          sed -i -E "s/(\?path=com\.uxcam\.unity#v)[0-9A-Za-z.-]+/\1$VERSION/g" README.md

          # Moves the hand-written notes out of "## [Unreleased]" and adds the release notes under the new version.
          awk -v heading="## [$VERSION] - $(date -u +%Y-%m-%d)" -v notes="$RUNNER_TEMP/release-notes.md" '
            !done && $0 == "## [Unreleased]" {
              print; print ""; print heading; print ""
              while ((getline line < notes) > 0) print line
              print ""
              done = 1; skipping = 1; next
            }
            skipping && /^## \[/ { skipping = 0 }
            !skipping { print }
          ' "$CHANGELOG" > "$RUNNER_TEMP/CHANGELOG.md"
          mv "$RUNNER_TEMP/CHANGELOG.md" "$CHANGELOG"

          check() { grep -qF "$2" "$1" || { echo "Could not write the version into $1." >&2; exit 1; }; }
          check com.uxcam.unity/package.json "\"version\": \"$VERSION\""
          check com.uxcam.unity/Runtime/UXCam.cs "PluginVersion = \"$VERSION\""
          check README.md "#v$VERSION"
          check "$CHANGELOG" "## [$VERSION] - "

      - name: Push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore: release v$VERSION"
          git push --force origin "$BRANCH"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Merging this pull request releases **v$VERSION**: it tags the merge commit and creates the GitHub release"
            echo "from the \`CHANGELOG.md\` entry below."
            echo
            echo "To reword the notes, edit \`com.uxcam.unity/CHANGELOG.md\` on this branch. Running *Release PR* again"
            echo "rebuilds this branch from \`main\` and replaces those edits."
            echo
            echo "---"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } > "$RUNNER_TEMP/pr-body.md"

          # Only one release pull request at a time.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/v")) | select(.headRefName != env.BRANCH) | .number' |
            while read -r number; do
              gh pr close "$number" --delete-branch --comment "Replaced by the v$VERSION release pull request."
            done

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2> /dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --title "chore: release v$VERSION" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "chore: release v$VERSION" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
